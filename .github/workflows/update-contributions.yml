name: Update GitHub Contributions Chart

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4[cite: 2]

      - name: Set up Python
        uses: actions/setup-python@v5[cite: 2]
        with:
          python-version: "3.11"[cite: 2]

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests[cite: 2]

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}[cite: 2]
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/update_contributions.py[cite: 2]

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"[cite: 2]
          git config user.email "github-actions[bot]@users.noreply.github.com"[cite: 2]
          git add README.md[cite: 2]
          git commit -m "📈 Update contribution chart" || echo "No changes to commit"[cite: 2]
          git push[cite: 2]